version: '3.8'

services:
  vanpattenairouter:
    image: vanpattenairouter
    container_name: vanpattenairouter
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "10080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__Path=/app/data/vanpatten-airrouter.db
      - Database__RecreateOnStartup=false
    volumes:
      - ./data:/app/data
      - ./appsettings.json:/app/appsettings.json:ro
      - ./appsettings.Development.json:/app/appsettings.Development.json:ro
    restart: unless-stopped
