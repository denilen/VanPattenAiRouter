version: '3.8'

services:
  vanpattenairouter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanpattenairouter
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
      - KILOCODE_API_KEY=${KILOCODE_API_KEY}
    volumes:
      - vanpatten_data:/app/data
    networks:
      - vanpatten_network

networks:
  vanpatten_network:
    driver: bridge

volumes:
  vanpatten_data: